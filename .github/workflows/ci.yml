---
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  packages: write        # чтобы пушить образы в GHCR встроенным токеном

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true   # новый push отменяет устаревший прогон

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pipx install ruff && ruff check .

  unit:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - working-directory: services/order-api
        run: |
          pip install -r requirements.txt -r requirements-dev.txt
          pytest -q

  build:
    needs: unit
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [order-api, order-worker, notifier]
    env:
      IMAGE: ghcr.io/checamaro/orders-${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image for scan
        uses: docker/build-push-action@v6
        with:
          context: services/${{ matrix.service }}
          load: true
          tags: scan:${{ matrix.service }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
      - name: Trivy scan (fail on CRITICAL)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:latest \
            image --exit-code 1 --severity CRITICAL --ignore-unfixed scan:${{ matrix.service }}
      - name: Login to GHCR
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push
        if: github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: services/${{ matrix.service }}
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha,scope=${{ matrix.service }}

  e2e:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make up
      - run: make e2e
      - name: Logs on failure
        if: failure()
        run: docker compose -f deploy/compose/docker-compose.yml logs > compose-logs.txt
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: compose-logs
          path: compose-logs.txt
      - if: always()
        run: make down
