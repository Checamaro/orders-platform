apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: { name: order-api, namespace: orders }
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: order-api }
  minReplicas: 2
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 60 }   # 60% от requests.cpu = 30m при requests 50m
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: { name: order-api, namespace: orders }
spec:
  minAvailable: 1               # при плановых работах на узлах хотя бы один под API остаётся живым
  selector: { matchLabels: { app: order-api } }
  