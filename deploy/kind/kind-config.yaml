kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: orders
nodes:
  - role: control-plane
    extraPortMappings:          # порт узла kind → порт сервера dev
      - containerPort: 30080
        hostPort: 8088
        listenAddress: "127.0.0.1"   # только localhost: Docker обходит ufw
  - role: worker
  - role: worker