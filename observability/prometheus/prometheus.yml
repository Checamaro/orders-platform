global:
  scrape_interval: 5s        # для лабы часто; в проде обычно 15–30s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: order-api
    static_configs:
      - targets: ["order-api:8000"]
  - job_name: order-worker
    dns_sd_configs:           # DNS Docker отдаёт адреса всех реплик — найдём каждый воркер
      - names: ["order-worker"]
        type: A
        port: 8001
  - job_name: notifier
    static_configs:
      - targets: ["notifier:8001"]
  - job_name: kafka-exporter
    static_configs:
      - targets: ["kafka-exporter:9308"]